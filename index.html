<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0b0d11">
<title>黑格尔《逻辑学》通关</title>
<meta name="description" content="48 道选择题，跟着《逻辑学》自己的结构走一遍：存在论、本质论、概念论。每题答完给解释和例子。">
<meta property="og:type" content="website">
<meta property="og:title" content="黑格尔《逻辑学》通关">
<meta property="og:description" content="48 道选择题，把《逻辑学》的范畴表走一遍。答错不打紧，每题都有解释和例子。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d11'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23c9a961' stroke-width='1.4'/%3E%3Cpath d='M11 20 L16 10 L21 20' fill='none' stroke='%23c9a961' stroke-width='1.4'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#c9a961;--gold2:#e6cf94;--dim:#8a7440;
  --ink:#07080b;--panel:rgba(17,21,27,.92);
  --text:#e8e0cc;--muted:#8d8778;--line:rgba(201,169,97,.22);
  --ok:#7fae86;--no:#c0706a;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);overflow:hidden;
  font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:560px;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(120% 60% at 50% 0%,#1c2430 0%,#0d1117 45%,#07080b 80%)}
.bg:after{content:"";position:absolute;inset:0;opacity:.4;
  background-image:radial-gradient(circle at 18% 25%,rgba(201,169,97,.07),transparent 42%),
                   radial-gradient(circle at 82% 72%,rgba(120,150,200,.05),transparent 45%)}

/* ---------- 通用 ---------- */
.screen{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;
  transition:opacity .35s,transform .35s;background:transparent}
.screen.out{opacity:0;transform:translateY(-10px);pointer-events:none}
.hidden{display:none!important}

/* ---------- 首页 ---------- */
#home{overflow-y:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}
.brand{text-align:center;padding:6px 0 16px}
.brand h1{font-size:26px;font-weight:400;letter-spacing:.1em;color:#efe6cf}
.brand .sub{font-size:11px;letter-spacing:.26em;color:var(--dim);margin-top:9px}
.brand .orn{width:36px;height:1px;background:var(--dim);margin:14px auto 0}
.hero{margin-top:6px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:rgba(201,169,97,.035)}
.hero p{font-size:13px;line-height:1.95;color:#b8b0a0}
.hero b{color:var(--gold2);font-weight:400}
.stat{display:flex;gap:8px;margin:12px 0 4px}
.stat div{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px 4px;background:rgba(255,255,255,.02)}
.stat b{display:block;font-size:19px;color:var(--gold2);font-weight:400;letter-spacing:.02em}
.stat span{font-size:10.5px;color:var(--muted);letter-spacing:.1em}
.sec-t{font-size:11px;letter-spacing:.3em;color:var(--dim);margin:20px 2px 10px}
.mods{display:flex;flex-direction:column;gap:9px}
.mod{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:rgba(17,21,27,.7);
  display:flex;align-items:center;gap:12px;cursor:pointer;transition:.22s;position:relative;overflow:hidden}
.mod:active{transform:scale(.985);background:rgba(201,169,97,.09)}
.mod .no{font-size:20px;color:var(--dim);min-width:26px;text-align:center;font-weight:400}
.mod .txt{flex:1;min-width:0}
.mod .txt h3{font-size:15px;font-weight:400;letter-spacing:.04em;color:#e5dcc6}
.mod .txt p{font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:.02em}
.mod .pct{font-size:11px;color:var(--dim);letter-spacing:.06em;white-space:nowrap}
.mod .bar{position:absolute;left:0;bottom:0;height:2px;background:linear-gradient(90deg,#8a7440,var(--gold2));width:0;transition:width .5s}
.mod.done{border-color:rgba(201,169,97,.5)}
.mod.done .pct{color:var(--gold2)}
.foot{display:flex;gap:8px;margin-top:18px}
.fbtn{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--line);color:#b9b0a0;
  font-family:inherit;font-size:12.5px;letter-spacing:.1em;padding:11px 6px;border-radius:10px;cursor:pointer}
.fbtn:active{background:rgba(201,169,97,.12)}
.tiny{text-align:center;font-size:10.5px;color:#4f4b42;line-height:1.9;margin-top:16px}

/* ---------- 答题 ---------- */
#quiz{padding:calc(8px + env(safe-area-inset-top)) 0 calc(10px + env(safe-area-inset-bottom))}
.qhead{display:flex;align-items:center;gap:10px;padding:6px 16px 8px}
.back{background:none;border:none;color:var(--dim);font-size:20px;font-family:inherit;
  padding:2px 6px;cursor:pointer;line-height:1}
.qhead .mid{flex:1;min-width:0}
.qhead .mid h4{font-size:12px;font-weight:400;color:#a89e88;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qhead .mid .bar{height:2px;background:rgba(255,255,255,.07);border-radius:2px;margin-top:7px;overflow:hidden}
.qhead .mid .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a7440,var(--gold2));transition:width .4s}
.qhead .cnt{font-size:11.5px;color:var(--dim);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.qbody{flex:1;overflow-y:auto;padding:6px 16px 16px}
.qtag{display:inline-block;font-size:10px;letter-spacing:.18em;color:var(--dim);border:1px solid var(--line);
  border-radius:20px;padding:2px 9px;margin-bottom:12px}
.qtext{font-size:17.5px;line-height:1.8;color:#ece3cf;letter-spacing:.01em;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);color:#ddd4be;
  padding:12px 14px;border-radius:11px;font-family:inherit;font-size:14.5px;line-height:1.65;
  display:flex;gap:10px;align-items:flex-start;cursor:pointer;transition:.2s;width:100%}
.opt .k{color:var(--dim);font-size:11.5px;padding-top:2px;min-width:13px}
.opt:active{transform:scale(.99)}
.opt:disabled{cursor:default}
.opt.right{border-color:rgba(127,174,134,.65);background:rgba(127,174,134,.12);color:#dff0e0}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:rgba(192,112,106,.6);background:rgba(192,112,106,.1);color:#e8cfcc}
.opt.wrong .k{color:var(--no)}
.opt.dim{opacity:.45}

.fb{margin-top:16px;border-radius:12px;border:1px solid var(--line);background:rgba(201,169,97,.05);
  padding:14px 15px;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fb .judge{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.1em;margin-bottom:9px}
.fb .judge.ok{color:var(--ok)}
.fb .judge.no{color:var(--no)}
.fb .judge span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.fb .why{font-size:14px;line-height:1.85;color:#d5ccb8}
.fb .eg{margin-top:10px;font-size:13px;line-height:1.8;color:#a89e88;
  border-left:2px solid rgba(201,169,97,.35);padding-left:10px}
.fb .term{display:inline-block;margin-top:11px;font-size:11px;color:var(--gold);
  border:1px solid rgba(201,169,97,.32);border-radius:20px;padding:2px 9px;letter-spacing:.08em}
.nextbar{margin-top:14px;display:flex;gap:8px}
.nextbar button{flex:1;background:linear-gradient(180deg,rgba(201,169,97,.16),rgba(201,169,97,.05));
  border:1px solid rgba(201,169,97,.55);color:var(--gold2);font-family:inherit;font-size:14px;
  letter-spacing:.2em;padding:13px;border-radius:10px;cursor:pointer}
.nextbar button:active{transform:scale(.99);background:rgba(201,169,97,.24)}

/* ---------- 章节小结 ---------- */
#summary,#result{overflow-y:auto;padding:calc(30px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom))}
.sum-top{text-align:center;margin-bottom:22px}
.sum-top .k{font-size:11px;letter-spacing:.3em;color:var(--dim)}
.sum-top h2{font-size:23px;font-weight:400;letter-spacing:.08em;color:var(--gold2);margin-top:10px}
.sum-top .sc{font-size:13px;color:var(--muted);margin-top:8px;letter-spacing:.08em}
.points{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:rgba(201,169,97,.04)}
.points li{list-style:none;font-size:13.5px;line-height:1.85;color:#cfc7b4;padding-left:16px;position:relative;margin-bottom:9px}
.points li:before{content:"·";position:absolute;left:2px;color:var(--gold)}
.points li:last-child{margin-bottom:0}
.wronglist{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.wq{border:1px solid rgba(192,112,106,.3);border-radius:10px;padding:11px 13px;background:rgba(192,112,106,.06);font-size:13px;line-height:1.7;color:#cfc7b4}
.wq b{display:block;color:#e0c9c4;font-weight:400;margin-bottom:5px}
.wq em{font-style:normal;color:var(--muted);font-size:12.5px}
.bigbtn{width:100%;margin-top:20px;background:linear-gradient(180deg,rgba(201,169,97,.16),rgba(201,169,97,.05));
  border:1px solid rgba(201,169,97,.55);color:var(--gold2);font-family:inherit;font-size:15px;
  letter-spacing:.24em;padding:14px;border-radius:10px;cursor:pointer}
.bigbtn.ghost{background:none;color:#a89e88;border-color:var(--line);font-size:13px;letter-spacing:.14em;padding:11px}

/* ---------- 术语表 ---------- */
#cards{position:absolute;inset:0;z-index:30;background:rgba(6,7,10,.94);backdrop-filter:blur(14px);
  transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.85,.2,1);display:flex;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
#cards.on{transform:translateY(0)}
.cards-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cards-h h3{font-size:15px;font-weight:400;letter-spacing:.2em;color:var(--gold)}
.cards-h button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:20px;
  padding:4px 12px;font-family:inherit;font-size:12px;cursor:pointer}
#cardList{overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.card{border:1px solid rgba(201,169,97,.18);border-radius:12px;padding:12px 14px;background:rgba(201,169,97,.04)}
.card h4{font-size:14px;color:var(--gold2);font-weight:400;letter-spacing:.06em;margin-bottom:6px}
.card p{font-size:13px;line-height:1.8;color:#cfc7b4}
.card .eg{margin-top:7px;font-size:12.5px;color:#948c7c;border-left:2px solid rgba(201,169,97,.3);padding-left:9px;line-height:1.7}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:34px 0;line-height:1.9}
</style>
</head>
<body>
<div id="app">
  <div class="bg"></div>

  <!-- 首页 -->
  <section class="screen" id="home">
    <div class="brand">
      <h1>《逻辑学》通关</h1>
      <div class="sub">黑 格 尔 · 范 畴 的 自 我 运 动</div>
      <div class="orn"></div>
    </div>
    <div class="hero">
      <p>这本书号称西方哲学最难读的一本。难，不在于词多，而在于它的每一个范畴都不是「定义」，而是<b>自己否定自己、再走到下一个</b>的运动。<br>48 道题，按书自己的结构走一遍：存在论 → 本质论 → 概念论。答错不要紧，每题都告诉你<b>为什么</b>，再给一个例子。</p>
    </div>
    <div class="stat">
      <div><b id="sTotal">0</b><span>已答</span></div>
      <div><b id="sRight">0</b><span>答对</span></div>
      <div><b id="sCards">0</b><span>术语卡</span></div>
    </div>
    <div class="sec-t">六 章 · 顺 序 通 关</div>
    <div class="mods" id="modList"></div>
    <div class="foot">
      <button class="fbtn" id="btnCards">术语表</button>
      <button class="fbtn" id="btnWrong">错题本</button>
      <button class="fbtn" id="btnReset">清空记录</button>
    </div>
    <div class="tiny"><a href="https://cuishengzhu.github.io/hegel-night/" style="color:#8a7440;text-decoration:none;border-bottom:1px solid rgba(201,169,97,.3);padding-bottom:1px">还没玩过前传「与黑格尔夜谈」？→</a></div>
    <div class="tiny">本习题集是通俗讲解，范畴译名用通行中译（贺麟/杨一之、梁志学）。<br>想读原著：先读《逻辑学》的「导论」和「必须从何开始」两节。</div>
  </section>

  <!-- 答题 -->
  <section class="screen hidden" id="quiz">
    <div class="qhead">
      <button class="back" id="qBack">←</button>
      <div class="mid">
        <h4 id="qMod"></h4>
        <div class="bar"><i id="qBar"></i></div>
      </div>
      <div class="cnt" id="qCnt">1/8</div>
    </div>
    <div class="qbody">
      <div id="qTag" class="qtag"></div>
      <div class="qtext" id="qText"></div>
      <div class="opts" id="qOpts"></div>
      <div id="qFb"></div>
    </div>
  </section>

  <!-- 小结 / 总结 -->
  <section class="screen hidden" id="summary"></section>
  <section class="screen hidden" id="result"></section>

  <!-- 术语表 -->
  <div id="cards">
    <div class="cards-h"><h3>术语表</h3><button id="cardsClose">合上</button></div>
    <div id="cardList"></div>
  </div>
</div>
<script>
/* 黑格尔《逻辑学》习题数据
   章节结构依照原书：存在论（质·量·尺度）→ 本质论（反思·现象·现实）→ 概念论（主观性·客观性·理念） */

const MODULES = [];

/* ======================= 一 · 导论 ======================= */
MODULES.push({
  id:'m1', num:'一', title:'逻辑学是什么',
  sub:'导论 · 方法 · 开端',
  points:[
    '逻辑学不是思维技巧，而是存在的规定（范畴）自己展开的科学——所以它同时是本体论。',
    '「正—反—合」是后人的标签；黑格尔自己说的是知性—辩证—思辨三环节，而且「合」不是折中。',
    '开端必须最空洞：任何带着内容的东西都已经预设了前提。',
    '三环节缺一不可：只停在第一环是教条，只停在第二环是破坏，走到第三环才是知识。'
  ],
  qs:[
    {id:'m1q1', term:'逻辑学＝本体论',
     t:'《逻辑学》研究的是什么？',
     o:['人脑进行推理时的心理规律',
        '存在本身的范畴结构——思想用来把握存在的那些最基本规定',
        '科学论证的形式规则（比如三段论的格与式）',
        '语言的语法结构'],
     a:1,
     why:'黑格尔的逻辑学不是「怎么想」的技术，而是「是」本身的规定系统。他称逻辑学为「真理的王国」：范畴不是人脑里的主观框架，而是事物得以成立的方式。所以逻辑学在他那里同时就是本体论。',
     eg:'你说「这朵花是红的」——「这」「是」「红」这些规定既属于你的思维，也属于花本身。把它们劈成两半（思维归思维，存在归存在），正是他要拆掉的那道墙。'},

    {id:'m1q2', term:'知性—辩证—思辨',
     t:'关于「正—反—合」这个说法，哪一句最准确？',
     o:['它是黑格尔全书严格套用的公式，每一节都按这三步走',
        '它是后人的概括；黑格尔本人极少用这三个词，他自己的说法是知性—辩证—思辨三个环节',
        '它是辩证法的唯一规律，其余内容都由它推论出来',
        '它的意思是：先立论，再反驳，最后各让一步取中间'],
     a:1,
     why:'「正—反—合」来自康德一系的用语，黑格尔在《逻辑学》里几乎不用。他讲的是同一思维的三环节：知性的抽象规定、辩证的自我否定、思辨的具体重建。更要紧的是：「合」不是折中——折中把两边都削弱，扬弃把两边都提高。',
     eg:'折中：你喜欢热闹、我喜欢清静，那每周各迁就一半。扬弃：我们吵明白「热闹」和「清静」各自缺了什么，然后过一种两人原先都没想到的生活。'},

    {id:'m1q3', term:'无前提的开端',
     t:'为什么《逻辑学》要从「有（Sein）」开始，而不从上帝、自我或经验开始？',
     o:['因为「有」是最容易理解的词',
        '因为开端必须最直接、最无规定；任何更具体的东西都已经预设了别的规定',
        '因为宗教和经验的材料不可靠',
        '因为古希腊哲学都是这么做的'],
     a:1,
     why:'「无前提」不是「什么都不要」，而是一个决定：不接受任何未经证明的预设。上帝、自我、经验都太「丰富」，都带着一堆前提。剩下能当开端的，只有最空的那个字——「是／有」。空到几乎没有内容，这既是它作为开端的资格，也是它立刻崩溃的原因。',
     eg:'盖房子先打地基，但地基不能已经是房子。「有」就是那个还不是任何房子的地基。'},

    {id:'m1q4', term:'知性逻辑',
     t:'黑格尔怎么看待亚里士多德的形式逻辑？',
     o:['认为它全是错的，应当废除',
        '认为它只是「知性」的环节，被保留下来但降为局部——它管分离，不管生成',
        '认为它和思辨逻辑其实是一回事',
        '没什么兴趣，觉得与哲学无关'],
     a:1,
     why:'他不否认矛盾律在日常推理中管用；他反对的是把「不许矛盾」当成世界的最高法则。形式逻辑教你把规定彼此隔开，思辨逻辑则追问：这些规定为什么非打架不可，打完架又长出了什么。',
     eg:'会计必须说「这笔钱要么是收入要么是支出」。但一个创业者的第一笔投入，账上是支出，同时也是他后来全部收入的根据。'},

    {id:'m1q5', term:'辩证法三环节',
     t:'「知性—辩证—思辨」这三个环节说的是什么？',
     o:['三种气质不同的哲学家',
        '同一次思考的三个必经阶段：先确定规定，再让它自我否定，最后在否定中重建具体的统一',
        '三个不同历史时期的逻辑学',
        '《逻辑学》的三卷'],
     a:1,
     why:'第一环把东西定死（「这是花」）；第二环发现它自己待不住（这花正开着，也正在凋谢）；第三环不是丢掉前两个，而是把握住「开放即凋谢」这个统一。缺第一环会变成空谈，缺第二环会变成教条，缺第三环就停在破坏里。',
     eg:'学游泳：先记动作要领（知性）→ 一下水全乱，发现要领互相打架（辩证）→ 最后身体自己会了，说不出要领却游得对（思辨）。'},

    {id:'m1q6', term:'具体／抽象',
     t:'黑格尔说「真理是具体的」，这里的「具体」是什么意思？',
     o:['指看得见摸得着的实物',
        '指多种规定性的内在统一（con-crescere，「长在一起」）',
        '指复杂难懂、需要长篇解释',

     a:1,

const KEY = 'hegel-logic-v1';

/* 用题号做种子的确定性乱序：刷新页面不会变，但正确答案不会总落在 B */
function seeded(str){
  let h = 2166136261 >>> 0;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return function(){
    h = (h + 0x6D2B79F5) >>> 0;
    let t = h;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

  q._m = mi; q._q = qi;

  for(let i=3;i>0;i--){ const j = Math.floor(r() * (i + 1)); const t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
  const newA = idx.indexOf(q.a);
  const newO = idx.map(i => q.o[i]);
  q.a = newA; q.o = newO;
  ALL.push(q);
}));

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const $ = s => document.querySelector(s);
const el = (t, c, h) => { const d = document.createElement(t); if(c) d.className = c; if(h!=null) d.innerHTML = h; return d; };

/* ---------- 屏幕切换 ---------- */
const SCREENS = {};
function show(name){
  Object.keys(SCREENS).forEach(k => { SCREENS[k].classList.toggle('hidden', k !== name); });
  document.querySelector('#app').scrollTop = 0;
  const sc = SCREENS[name]; if(sc) sc.scrollTop = 0;
}

/* ---------- 首页 ---------- */
function stats(){
  const ids = Object.keys(S.ans);
  let right = 0; ids.forEach(id => { if(S.ans[id].ok) right++; });
  return {answered: ids.length, right, total: ALL.length};
}
function renderHome(){
  const st = stats();
  $('#sTotal').textContent = st.answered + '/' + st.total;
  $('#sRight').textContent = st.right;
  const cardCount = ALL.filter(q => S.ans[q.id] && q.term).length;
  $('#sCards').textContent = cardCount;
  const box = $('#modList'); box.innerHTML = '';
  MODULES.forEach((m, i) => {
    const done = m.qs.filter(q => S.ans[q.id]).length;
    const d = el('div', 'mod' + (done === m.qs.length ? ' done' : ''));
    d.innerHTML = '<div class="no">' + m.num + '</div>' +
      '<div class="txt"><h3>' + m.title + '</h3><p>' + m.sub + '</p></div>' +
      '<div class="pct">' + done + '/' + m.qs.length + '</div>' +
      '<div class="bar" style="width:' + (done / m.qs.length * 100) + '%"></div>';
    d.onclick = () => startModule(i);
    box.appendChild(d);
  });
  show('home');
}

/* ---------- 答题 ---------- */
let cur = {m:0, q:0};

function startModule(mi){
  cur = {m:mi, q:0};
  // 从第一道未答的题开始；全答过则从头复习
  const qs = MODULES[mi].qs;
  const firstUn = qs.findIndex(q => !S.ans[q.id]);
  cur.q = firstUn < 0 ? 0 : firstUn;
  show('quiz');
  renderQ();
}

function renderQ(){
  const m = MODULES[cur.m], q = m.qs[cur.q];
  $('#qMod').textContent = m.num + ' · ' + m.title;
  $('#qCnt').textContent = (cur.q + 1) + '/' + m.qs.length;
  $('#qBar').style.width = ((cur.q + (S.ans[q.id] ? 1 : 0)) / m.qs.length * 100) + '%';
  $('#qTag').textContent = q.term || '概念';
  $('#qText').textContent = q.t;
  const opts = $('#qOpts'); opts.innerHTML = '';
  const prev = S.ans[q.id];
  q.o.forEach((txt, i) => {
    const b = el('button', 'opt');
    b.innerHTML = '<span class="k">' + L[i] + '</span><span>' + txt + '</span>';
    b.onclick = () => answer(i);
    if(prev){
      b.disabled = true;
      if(i === q.a) b.classList.add('right');
      else if(i === prev.p) b.classList.add('wrong');
      else b.classList.add('dim');
    }
    opts.appendChild(b);
  });
  $('#qFb').innerHTML = '';
  if(prev) renderFeedback(q, prev.p, prev.ok, false);
  $('#quiz').scrollTop = 0;
  $('.qbody').scrollTop = 0;
}

function answer(i){
  const m = MODULES[cur.m], q = m.qs[cur.q];
  if(S.ans[q.id]) return;
  const ok = (i === q.a);
  S.ans[q.id] = {p:i, ok};
  save();
  const btns = document.querySelectorAll('#qOpts .opt');
  btns.forEach((b, k) => {
    b.disabled = true;
    if(k === q.a) b.classList.add('right');
    else if(k === i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  renderFeedback(q, i, ok, true);
}

function renderFeedback(q, picked, ok, scroll){
  const fb = $('#qFb');
  fb.innerHTML = '';
  const card = el('div', 'fb');
  card.innerHTML =
    '<div class="judge ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ 答对了' : '✗ 不对') +
      (ok ? '<span>顺手记一下，这种题下次会变个样子再来。</span>'
          : '<span>正确答案是 ' + L[q.a] + '。</span>') + '</div>' +
    '<div class="why">' + q.why + '</div>' +
    (q.eg ? '<div class="eg">' + q.eg + '</div>' : '') +
    (q.term ? '<div class="term">已收入术语表 · ' + q.term + '</div>' : '');
  fb.appendChild(card);

  const isLast = cur.q >= MODULES[cur.m].qs.length - 1;
  const nb = el('div', 'nextbar');
  const btn = el('button', '', isLast ? '完成本章' : '下一题 ▸');
  btn.onclick = () => { if(isLast) finishModule(); else { cur.q++; renderQ(); } };
  nb.appendChild(btn);
  fb.appendChild(nb);
  if(scroll) setTimeout(() => card.scrollIntoView({behavior:'smooth', block:'nearest'}), 80);
}

function finishModule(){
  const m = MODULES[cur.m];
  const ans = m.qs.filter(q => S.ans[q.id]);
  const right = ans.filter(q => S.ans[q.id].ok).length;
  const wrong = m.qs.filter(q => S.ans[q.id] && !S.ans[q.id].ok);

  const box = $('#summary');
  let html = '<div class="sum-top"><div class="k">第 ' + m.num + ' 章 · 完成</div>' +
    '<h2>' + m.title + '</h2>' +
    '<div class="sc">' + right + ' / ' + m.qs.length + ' 题正确' +
      (wrong.length ? '　·　' + wrong.length + ' 题待复盘' : '　·　全对') + '</div></div>';
  html += '<ul class="points">' + m.points.map(p => '<li>' + p + '</li>').join('') + '</ul>';
  if(wrong.length){
    html += '<div class="sec-t" style="color:#a8928a">这 几 题 值 得 再 看 一 遍</div><div class="wronglist">';
    wrong.forEach(q => {
      html += '<div class="wq"><b>' + q.t + '</b>正确答案：' + L[q.a] + '. ' + q.o[q.a] +
        '<br><em>' + q.why + '</em></div>';
    });
    html += '</div>';
  }
  html += '<button class="bigbtn" id="sumNext">' +
    (cur.m < MODULES.length - 1 ? '进入第 ' + MODULES[cur.m + 1].num + ' 章 · ' + MODULES[cur.m + 1].title : '查看总成绩') +
    '</button><button class="bigbtn ghost" id="sumHome">回目录</button>';
  box.innerHTML = html;
  $('#sumNext').onclick = () => {
    if(cur.m < MODULES.length - 1) startModule(cur.m + 1);
    else renderResult();
  };
  $('#sumHome').onclick = renderHome;
  show('summary');
}

/* ---------- 总成绩 ---------- */
function renderResult(){
  const st = stats();
  const pct = Math.round(st.right / st.total * 100);
  let verdict;
  if(pct >= 85) verdict = '你已经能读懂原著的黑体字了。接下来去读《逻辑学》的「导论」和「必须从何开始」。';
  else if(pct >= 65) verdict = '骨架已经有了。剩下的问题多半出在「反思」这一层——本质论是最绕的地方，值得再刷一遍。';
  else if(pct >= 40) verdict = '你抓住了几条主干（有—无—变、扬弃、矛盾），但范畴之间的「过渡」还没连成一串。建议重做错题，重点看每道题的「为什么」。';
  else verdict = '不着急。这本书本来就不是一次能读进去的：先把「有—无—变」和「规定即否定」这两点吃透，其余会自己接上。';

  let html = '<div class="sum-top"><div class="k">全 部 六 章</div><h2>' + st.right + ' / ' + st.total + '</h2>' +
    '<div class="sc">正确率 ' + pct + '%　·　术语卡 ' + ALL.filter(q => S.ans[q.id] && q.term).length + ' 张</div></div>' +
    '<div class="points"><li>' + verdict + '</li></div>';

  html += '<div class="sec-t">分 章 情 况</div><div class="wronglist">';
  MODULES.forEach((m, i) => {
    const ans = m.qs.filter(q => S.ans[q.id]);
    const r = ans.filter(q => S.ans[q.id].ok).length;
    html += '<div class="wq" style="border-color:rgba(201,169,97,.25);background:rgba(201,169,97,.04)">' +
      '<b style="color:#e0d6bf">' + m.num + ' · ' + m.title + '　' + r + '/' + m.qs.length + '</b>' +
      '<em>' + (r === m.qs.length ? '全对' : r >= m.qs.length * 0.6 ? '基本掌握' : '建议重做') + '</em></div>';
  });
  html += '</div>';
  html += '<button class="bigbtn" id="resWrong">重做错题</button>' +
          '<button class="bigbtn ghost" id="resHome">回目录</button>';
  $('#result').innerHTML = html;
  $('#resWrong').onclick = () => {
    const wrongIds = ALL.filter(q => S.ans[q.id] && !S.ans[q.id].ok).map(q => q.id);
    if(!wrongIds.length){ alert('没有错题，全对。'); return; }
    wrongIds.forEach(id => delete S.ans[id]);
    save();
    const firstM = ALL.find(q => wrongIds.indexOf(q.id) >= 0)._m;
    startModule(firstM);
  };
  $('#resHome').onclick = renderHome;
  show('result');
}

/* ---------- 错题本 ---------- */
function openWrongBook(){
  const wrong = ALL.filter(q => S.ans[q.id] && !S.ans[q.id].ok);
  let html = '<div class="sum-top"><div class="k">错 题 本</div><h2>' + wrong.length + ' 题</h2>' +
    '<div class="sc">' + (wrong.length ? '重做一遍比读三遍管用' : '还没有错题') + '</div></div>';
  if(wrong.length){
    html += '<div class="wronglist">';
    wrong.forEach(q => {
      html += '<div class="wq"><b>' + q.t + '</b>' +
        '你选了：' + L[S.ans[q.id].p] + '. ' + q.o[S.ans[q.id].p] +
        '<br>正确：' + L[q.a] + '. ' + q.o[q.a] +
        '<br><em>' + q.why + '</em></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="points"><li>你目前没有答错的题。要么你真的懂了，要么你还没开始——我希望是前者。</li></div>';
  }
  html += '<button class="bigbtn ghost" id="wbHome">回目录</button>';
  $('#result').innerHTML = html;
  $('#wbHome').onclick = renderHome;
  show('result');
}

/* ---------- 术语表 ---------- */
function renderCards(){
  const list = $('#cardList');
  const items = ALL.filter(q => S.ans[q.id] && q.term);
  if(!items.length){
    list.innerHTML = '<div class="empty">还没有术语。<br>答完题，术语会自动收进来。</div>';
    return;
  }
  list.innerHTML = '';
  items.forEach(q => {
    const d = el('div', 'card');
    d.innerHTML = '<h4>' + q.term + '</h4><p>' + q.why + '</p>' +
      (q.eg ? '<div class="eg">' + q.eg + '</div>' : '');
    list.appendChild(d);
  });
}

/* ---------- 事件 ---------- */
$('#qBack').onclick = renderHome;
$('#btnCards').onclick = () => { renderCards(); $('#cards').classList.add('on'); };
$('#cardsClose').onclick = () => $('#cards').classList.remove('on');
$('#btnWrong').onclick = openWrongBook;
$('#btnReset').onclick = () => {
  if(!confirm('清空所有答题记录？术语表和错题本会一起清空。')) return;
  S = {ans:{}}; save(); renderHome();
};

SCREENS.home = $('#home');
SCREENS.quiz = $('#quiz');
SCREENS.summary = $('#summary');
SCREENS.result = $('#result');

renderHome();

</script>
</body>
</html>
